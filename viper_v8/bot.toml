[bot]
name = "Viper_V8"
version = "8.0.0"

[sonar]
enabled = true
broadcast_interval = 1       # Broadcast sonar signal every round
max_listen_distance = 64     # Max radius to consider incoming signals

[roles]
sentinel_min_length = 6      # Minimum length required to transition to Sentinel
helper_max_pocket_units = 3  # Maximum helpers per pocket before dispersing
queen_consolidation_round = 420 # Round to restrict suicide feeding for tiebreaker #2

[swarm]
cohesion_weight = 1.2        # Attraction force toward friendly centroid
separation_weight = 2.0      # Repulsion force to prevent body clogging in tight corridors
pearl_claim_penalty = 15.0   # Path cost penalty for claimed pearl targets